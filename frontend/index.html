<html>
  <head>
    <title>Harmony - Home</title>
    <link rel="stylesheet" href="./styles.css" />
    <style>
      .container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        padding-bottom: 10vh; /* Optical centering nudge */
      }

      h1 {
        font-size: 5rem; /* Large and bold */
        font-weight: 900;
        margin: 0;
        letter-spacing: -2px;
        color: #ffffff;
      }

      .accent-char {
        color: #46ffff;
      }

      .tagline {
        font-size: 1.25rem;
        color: #a0a4b8;
        margin-top: 0.5rem;
        margin-bottom: 3rem;
        font-weight: 400;
      }

      .button-group {
        display: flex;
        gap: 20px;
      }

      /* Subtle background element to fill "dead" space */
      .bg-glow {
        position: absolute;
        top: 40%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 400px;
        height: 400px;
        background: radial-gradient(
          circle,
          rgba(70, 255, 255, 0.05) 0%,
          rgba(51, 53, 64, 0) 70%
        );
        z-index: -1;
      }
    </style>
  </head>
  <body style="overflow: hidden">
    <div class="bg-glow"></div>
    <div class="container">
      <h1>h<span class="accent-char">a</span>rmony</h1>
      <p class="tagline">ephemeral voice & chat</p>

      <div class="button-group">
        <button onclick="redirectToRoom()" class="btn primary large">
          Create Room &rarr;
        </button>
        <button class="btn secondary large">Join Room</button>
      </div>
    </div>
    <script>
      const roomIdGenerator = () =>
        Array.from(Array(12), () =>
          Math.floor(Math.random() * 36).toString(36),
        ).join("");

      const redirectToRoom = () => {
        window.location.href = `/room.html?id=${roomIdGenerator()}`;
      };
    </script>
  </body>
</html>
/html>
